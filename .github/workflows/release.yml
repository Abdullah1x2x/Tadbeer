# Builds signed Android APKs and the Linux and Windows x64 release archives when a version
# tag (v1.2.3) is pushed and attaches them to a GitHub release.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  the upload keystore (.jks), base64-encoded
#   ANDROID_KEY_ALIAS        the key alias (upload)
#   ANDROID_KEY_PASSWORD     the key password
#   ANDROID_STORE_PASSWORD   the keystore password
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      v8_sha256: ${{ steps.sums.outputs.v8 }}
      v7_sha256: ${{ steps.sums.outputs.v7 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Set up signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload.jks
          {
            echo "storeFile=upload.jks"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
            echo "storePassword=$STORE_PASSWORD"
          } > android/key.properties

      - name: Build v7 and v8 APKs
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64

      - name: Compute Android SHA-256 checksums
        id: sums
        run: |
          cd build/app/outputs/flutter-apk
          sha256sum app-*-release.apk > SHA256SUMS-android.txt
          echo "v8=$(sha256sum app-arm64-v8a-release.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "v7=$(sha256sum app-armeabi-v7a-release.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Remove signing files
        if: always()
        run: rm -f android/app/upload.jks android/key.properties

      - name: Publish Android release files
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS-android.txt

      - name: Keep Android files on manual runs
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS-android.txt

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libasound2-dev libsqlite3-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build Linux release bundle
        run: flutter build linux --release

      - name: Package Linux release archive
        id: package
        run: |
          mkdir -p build/linux-dist/tadbeer
          cp -a build/linux/x64/release/bundle/. build/linux-dist/tadbeer/
          tar -czf tadbeer-linux-x64.tar.gz -C build/linux-dist tadbeer
          sha256sum tadbeer-linux-x64.tar.gz > SHA256SUMS-linux.txt
          echo "sha256=$(cut -d' ' -f1 SHA256SUMS-linux.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish Linux release archive
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            tadbeer-linux-x64.tar.gz
            SHA256SUMS-linux.txt

      - name: Keep Linux archive on manual runs
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: linux-release
          path: |
            tadbeer-linux-x64.tar.gz
            SHA256SUMS-linux.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # The tests already run on Linux; this job only builds.
      - name: Build Windows release bundle
        run: flutter build windows --release

      # bsdtar ships with Windows and writes zip paths with forward slashes.
      - name: Package Windows release archive
        id: package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/windows-dist/tadbeer | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release/* build/windows-dist/tadbeer/
          tar -a -cf tadbeer-windows-x64.zip -C build/windows-dist tadbeer
          $hash = (Get-FileHash tadbeer-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  tadbeer-windows-x64.zip" | Out-File -Encoding ascii SHA256SUMS-windows.txt
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish Windows release archive
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            tadbeer-windows-x64.zip
            SHA256SUMS-windows.txt

      - name: Keep Windows archive on manual runs
        uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: windows-release
          path: |
            tadbeer-windows-x64.zip
            SHA256SUMS-windows.txt

  # version.json on main is what installed apps read. Moving main forward
  # only after the Android, Linux and Windows uploads finish means nobody is offered
  # an update before its files exist. The build hashes are only known now, so
  # they land in one commit on top of the tag, which apps verify downloads by.
  announce:
    needs: [android, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the build hashes into version.json
        env:
          V8: ${{ needs.android.outputs.v8_sha256 }}
          V7: ${{ needs.android.outputs.v7_sha256 }}
          LINUX: ${{ needs.linux.outputs.sha256 }}
          WINDOWS: ${{ needs.windows.outputs.sha256 }}
        run: |
          for h in "$V8" "$V7" "$LINUX" "$WINDOWS"; do
            [[ "$h" =~ ^[0-9a-f]{64}$ ]] || { echo "Missing build hash"; exit 1; }
          done
          jq --arg v8 "$V8" --arg v7 "$V7" --arg linux "$LINUX" --arg windows "$WINDOWS" \
            '.apk_sha256s = {"arm64-v8a": $v8, "armeabi-v7a": $v7} | .linux_sha256 = $linux | .windows_sha256 = $windows' \
            version.json > version.json.new
          mv version.json.new version.json
          cp version.json docs/version.json

      - name: Announce the update to installed apps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "release: ${GITHUB_REF_NAME} hashes"
          git push origin "HEAD:refs/heads/main"
