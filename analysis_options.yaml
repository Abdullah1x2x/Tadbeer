include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    unawaited_futures: warning
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - lib/l10n/**

linter:
  rules:
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - unawaited_futures
    - use_build_context_synchronously
    - prefer_final_locals
    - always_declare_return_types
